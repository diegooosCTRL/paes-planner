<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horario PAES Ciencias · Admisión 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bio: #2d7a5a;
    --bio-light: #e8f5ef;
    --bio-mid: #9fd8bf;
    --fis: #d05a1e;
    --fis-light: #fdf0e8;
    --fis-mid: #f5c0a0;
    --qui: #5a6dbf;
    --qui-light: #edf0fb;
    --qui-mid: #b3bbee;
    --ens: #8b4dad;
    --ens-light: #f4eef9;
    --ens-mid: #cdb3e8;
    --pre: #5a7a8f;
    --pre-light: #eaf2f6;
    --pre-mid: #aaccd8;
    --des: #888;
    --des-light: #f2f2f2;
    --break-c: #e0b820;
    --break-l: #fdf8e3;
    --bg: #fafaf9;
    --card: #ffffff;
    --border: #e8e5df;
    --text: #1a1814;
    --muted: #6b6660;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 4px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* HEADER */
  .header {
    background: var(--card);
    border-bottom: 1.5px solid var(--border);
    padding: 24px 32px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .header p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }
  .header-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 20px;
  }
  .badge-goal { background: #fff3e0; color: #b35c00; }
  .badge-date { background: #e8f0fe; color: #1a5ca8; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* NAV SEMANAS */
  .week-nav {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .week-nav::-webkit-scrollbar { display: none; }
  .week-tabs {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    gap: 0;
  }
  .week-tab {
    flex-shrink: 0;
    padding: 12px 18px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    transition: all .18s;
    white-space: nowrap;
    user-select: none;
  }
  .week-tab:hover { color: var(--text); }
  .week-tab.active { color: var(--text); border-bottom-color: var(--text); }
  .week-tab.exam { color: var(--ens); }
  .week-tab.exam.active { border-bottom-color: var(--ens); }

  /* LEGEND */
  .legend-bar {
    max-width: 1100px;
    margin: 20px auto 0;
    padding: 0 32px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    align-items: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  /* MAIN */
  .main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 32px 60px;
  }

  /* WEEK HEADER */
  .week-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .week-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
  }
  .week-focus {
    font-size: 12.5px;
    color: var(--muted);
    background: var(--des-light);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  /* DAYS GRID */
  .days-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  /* DAY CARD */
  .day-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .day-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .day-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .day-date { font-size: 11.5px; color: var(--muted); }
  .day-badge { font-size: 10.5px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }

  .day-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }

  /* BLOCK */
  .block {
    border-radius: var(--radius-sm);
    padding: 8px 11px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-left: 3px solid transparent;
  }
  .block-time {
    font-size: 10.5px;
    font-weight: 500;
    opacity: .75;
    font-family: 'DM Mono', monospace;
  }
  .block-label { font-size: 12.5px; font-weight: 500; }
  .block-sub { font-size: 11px; opacity: .8; }
  .block-tip { font-size: 10.5px; opacity: .65; margin-top: 1px; font-style: italic; }

  .block.bio { background: var(--bio-light); border-left-color: var(--bio); color: #1a5040; }
  .block.fis { background: var(--fis-light); border-left-color: var(--fis); color: #8a3010; }
  .block.qui { background: var(--qui-light); border-left-color: var(--qui); color: #2c3880; }
  .block.ens { background: var(--ens-light); border-left-color: var(--ens); color: #5c2878; }
  .block.pre { background: var(--pre-light); border-left-color: var(--pre); color: #2a4a5a; }
  .block.brk { background: var(--break-l); border-left-color: var(--break-c); color: #7a5a00; }
  .block.des { background: var(--des-light); border-left-color: var(--des); color: #555; }
  .block.cor { background: #f0f4ff; border-left-color: #4a6eb5; color: #1a2d6a; }

  .day-card.noday { opacity: 0.55; }
  .day-card.noday .day-body { padding: 20px 16px; }
  .noday-msg { font-size: 12.5px; color: var(--muted); text-align: center; }

  /* WEEK SUMMARY */
  .week-summary {
    margin-top: 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .summary-col { flex: 1; min-width: 180px; }
  .summary-col h4 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
  .summary-col ul { list-style: none; }
  .summary-col li { font-size: 12.5px; color: var(--text); padding: 2px 0; display: flex; align-items: center; gap: 6px; }
  .summary-col li::before { content: '·'; color: var(--muted); }

  /* TEMARIO PANEL */
  .temario-panel {
    margin-top: 32px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .temario-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
  }
  .temario-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .temario-col {
    padding: 16px 18px;
    border-right: 1px solid var(--border);
  }
  .temario-col:last-child { border-right: none; }
  .temario-col h4 { font-size: 12px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .temario-col ul { list-style: none; }
  .temario-col li { font-size: 11.5px; color: var(--muted); padding: 3px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 5px; }
  .temario-col li:last-child { border-bottom: none; }
  .temario-col li .chk { font-size: 10px; }

  /* EXAM ALERT */
  .exam-alert {
    background: var(--ens-light);
    border: 1px solid var(--ens-mid);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .exam-alert-icon { font-size: 28px; }
  .exam-alert h3 { font-size: 14px; font-weight: 600; color: var(--ens); }
  .exam-alert p { font-size: 12.5px; color: #7040a0; margin-top: 3px; }

  /* PRINT / MOBILE */
  @media (max-width: 700px) {
    .header { padding: 16px 16px 14px; }
    .week-nav { padding: 0 16px; }
    .legend-bar { padding: 0 16px; }
    .main { padding: 16px 16px 40px; }
    .days-grid { grid-template-columns: 1fr; }
    .temario-grid { grid-template-columns: 1fr; }
    .temario-col { border-right: none; border-bottom: 1px solid var(--border); }
    .week-summary { gap: 14px; }
    .header h1 { font-size: 17px; }
  }
  @media (min-width: 701px) and (max-width: 960px) {
    .days-grid { grid-template-columns: repeat(2, 1fr); }
    .temario-grid { grid-template-columns: repeat(2, 1fr); }
    .temario-col:nth-child(2) { border-right: none; }
  }
</style>
</head>

function renderBlock(b) {
  return `<div class="block ${b.type}">
    <span class="block-time">${b.time}</span>
    <span class="block-label">${b.label}</span>
    ${b.sub ? `<span class="block-sub">${b.sub}</span>` : ''}
    ${b.tip ? `<span class="block-tip">${b.tip}</span>` : ''}
  </div>`;
}

function renderDay(day) {
  if (day.noday && !day.blocks) {
    return `<div class="day-card noday">
      <div class="day-header">
        <span class="day-name">${day.name}</span>
        <span class="day-date">${day.date}</span>
      </div>
      <div class="day-body"><p class="noday-msg">Sin disponibilidad / Descanso</p></div>
    </div>`;
  }
  const tagHtml = day.tag ? `<span class="day-badge" style="background:${day.tagColor || '#eee'};color:#fff">${day.tag}</span>` : '';
  return `<div class="day-card">
    <div class="day-header">
      <span class="day-name">${day.name} <span style="font-weight:400;color:var(--muted)">${day.date}</span></span>
      ${tagHtml}
    </div>
    <div class="day-body">
      ${day.blocks.map(renderBlock).join('')}
      ${day.note ? `<p style="font-size:11px;color:var(--muted);margin-top:6px;padding:6px 8px;background:var(--des-light);border-radius:6px">${day.note}</p>` : ''}
    </div>
  </div>`;
}

function renderWeek(week) {
  const isExam = week.id === 4;
  const examAlert = isExam ? `<div class="exam-alert">
    <div class="exam-alert-icon">🎯</div>
    <div>
      <h3>¡Última semana antes del examen!</h3>
      <p>Sin materia nueva. Solo síntesis, descanso activo y preparación mental. La semana más importante no es la de más estudio, sino la de mejor recuperación.</p>
    </div>
  </div>` : '';

  const contenidosHtml = week.summary.contenidos.map(c => `<li>${c}</li>`).join('');
  const estrategiaHtml = week.summary.estrategia.map(e => `<li>${e}</li>`).join('');

  return `
    ${examAlert}
    <div class="week-header">
      <span class="week-title">${week.label}</span>
      <span class="week-focus">${week.focus}</span>
    </div>
    <div class="days-grid">
      ${week.days.map(renderDay).join('')}
    </div>
    <div class="week-summary">
      <div class="summary-col">
        <h4>Contenidos esta semana</h4>
        <ul>${contenidosHtml}</ul>
      </div>
      <div class="summary-col">
        <h4>Estrategia / Notas</h4>
        <ul>${estrategiaHtml}</ul>
      </div>
    </div>
    <div class="temario-panel">
      <div class="temario-header">📋 Temario PAES Ciencias · Admisión 2027 — Vista rápida</div>
      <div class="temario-grid">
        <div class="temario-col">
          <h4 style="color:var(--fis)">⚡ Física</h4>
          <ul>
            <li><span class="chk">▸</span> Ondas electromagnéticas</li>
            <li><span class="chk">▸</span> Espectro EM y fenómenos</li>
            <li><span class="chk">▸</span> Espejos y lentes</li>
            <li><span class="chk">▸</span> Mecánica: Leyes de Newton</li>
            <li><span class="chk">▸</span> Fuerzas: peso, roce, tensión</li>
            <li><span class="chk">▸</span> Energía-Tierra: tectónica</li>
            <li><span class="chk">▸</span> Electricidad: Ley de Ohm</li>
            <li><span class="chk">▸</span> Circuitos serie, paralelo</li>
          </ul>
        </div>
        <div class="temario-col">
          <h4 style="color:var(--qui)">⚗️ Química</h4>

            <li><span class="chk">▸</span> Modelos atómicos</li>
            <li><span class="chk">▸</span> Número atómico y másico</li>

function init() {
  const tabsEl = document.getElementById('weekTabs');
  const mainEl = document.getElementById('mainContent');
  let active = 0;

  WEEKS.forEach((w, i) => {
    const tab = document.createElement('div');
    tab.className = 'week-tab' + (i === 0 ? ' active' : '') + (i === 4 ? ' exam' : '');
    tab.textContent = w.label;
    tab.onclick = () => {
      document.querySelectorAll('.week-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      active = i;
      mainEl.innerHTML = renderWeek(WEEKS[i]);
      mainEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    tabsEl.appendChild(tab);
  });

  mainEl.innerHTML = renderWeek(WEEKS[0]);
}

init();
